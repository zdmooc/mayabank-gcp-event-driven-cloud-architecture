name: ci

on:
  push:
    branches: ["feature/gcp-automotive-financial-hub"]
  pull_request:

permissions:
  contents: read

jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test Spring Boot composition
        run: mvn -B verify
      - name: Run architecture self-tests
        run: |
          java -cp domain-core/target/classes:domain-core/target/test-classes com.maya.finance.domain.CoreModelSelfTest
          java -cp domain-core/target/classes:domain-core/target/test-classes com.maya.finance.domain.MatchingSelfTest
          java -cp domain-core/target/classes:domain-core/target/test-classes com.maya.finance.domain.EngagementSelfTest
          java -cp domain-core/target/classes:domain-core/target/test-classes com.maya.finance.events.EventEnvelopeSelfTest
          java -cp domain-core/target/classes:domain-core/target/test-classes com.maya.finance.reliability.ReliabilitySelfTest

  contract-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyYAML==6.0.3
      - name: Validate contract syntax and baseline structure
        run: python scripts/validate_contracts.py

  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.2'
      - name: Terraform format
        run: terraform fmt -check -recursive terraform
      - name: Validate bootstrap
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false
          terraform -chdir=terraform/bootstrap validate
      - name: Validate dev environment
        run: |
          terraform -chdir=terraform/environments/dev init -backend=false
          terraform -chdir=terraform/environments/dev validate
